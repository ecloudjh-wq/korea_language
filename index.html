<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>K.Bias Interactive Prototype v16 · Premium Polish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css" />
</head>
<body class="review-layout premium-v16">
<div class="prototype-shell review-shell">
  <aside class="prototype-panel review-menu-column">
    <div class="review-menu-inner">
      <div class="panel-brand"><span class="panel-logo">K</span><div><b>K.Bias</b><small>대표님 검토용 프로토타입</small></div></div>
      <div class="panel-actions"><button id="resetPrototype" class="panel-btn">처음 화면</button><button id="toggleFrame" class="panel-btn">앱만 보기</button></div>
      <div class="panel-group"><b>화면 메뉴</b><div id="prototypeMenu"></div></div>
    </div>
  </aside>

  <main class="prototype-workspace review-prototype-column">
    <div class="device-wrap">
      <div class="device-toolbar"><button id="browserBack">← 뒤로</button><span id="routeLabel">홈</span><button id="presentationMode">전체화면</button></div>
      <section class="device" id="device"><div class="app" id="app"></div><div id="persistentNav"></div><div id="toast" class="toast"></div></section>
    </div>
  </main>

  <aside class="review-guide-column" id="guidePanel">
    <div class="review-guide-inner">
      <div class="guide-meta"><span id="guideCategory">HOME</span><small id="guideScreenNo">SCREEN 01</small></div>
      <h1 id="guideTitle">홈</h1>
      <p class="guide-lead" id="guideDescription">AI 모델과 신규 콘텐츠를 중심으로 보여주는 첫 화면</p>

      <section class="guide-section">
        <h2>화면 목적</h2>
        <p id="guidePurpose"></p>
      </section>
      <section class="guide-section">
        <h2>주요 구성</h2>
        <ul id="guideComponents"></ul>
      </section>
      <section class="guide-section">
        <h2>인터랙션</h2>
        <ul id="guideInteractions"></ul>
      </section>
      <section class="guide-section guide-flow-section">
        <h2>주요 이동</h2>
        <div id="guideFlow" class="guide-flow"></div>
      </section>

      <div class="guide-note" id="guideNote"></div>
    </div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
